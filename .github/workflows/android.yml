name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which APK to build"
        type: choice
        default: both
        options: [debug, release, both]

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `packages` is set explicitly: the action's default list still includes
      # the long-removed "tools" package, which now fails the whole step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint (Kotlin compile + Android lint)
        run: ./gradlew --no-daemon lintDebug

      - name: Assemble debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_type != 'release'
        run: ./gradlew --no-daemon assembleDebug

      # Signs the release APK when a keystore is configured in repository
      # secrets; without them the release build is skipped (an unsigned APK
      # cannot be installed on a phone).
      - name: Decode release keystore
        id: keystore
        if: >-
          (github.event_name != 'workflow_dispatch' || inputs.build_type != 'debug')
          && env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        if: steps.keystore.outputs.path != ''
        env:
          SUBBURN_KEYSTORE: ${{ steps.keystore.outputs.path }}
          SUBBURN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SUBBURN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SUBBURN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p artifacts
          # ABI splits mean several APKs per variant, so keep each file's own name.
          find app/build/outputs/apk -name '*.apk' -print0 |
            while IFS= read -r -d '' apk; do
              name=$(basename "$apk" .apk | sed 's/^app-/SubBurn-/')
              cp "$apk" "artifacts/${name}-${GITHUB_SHA::7}.apk"
            done
          ls -lh artifacts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SubBurn-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Attach APKs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
